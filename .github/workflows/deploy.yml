name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          echo "Setting up deploy"
          echo "API_BASE_URL=${{ vars.API_BASE_URL }}"
          echo "API_KEY=${{ vars.API_KEY }}"
